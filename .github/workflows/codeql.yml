name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"  # weekly, for new queries against unchanged code

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload results to Security → Code scanning
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # vendored minified libraries and build output would bury real findings in noise
          config: |
            paths-ignore:
              - app/web/static/vendor
              - "**/*.compiled.js"
              - app/web/static/ds/_ds_bundle.js
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
