name: CI

on:
  push:
  pull_request:

# least privilege: jobs only read the repo; publish asks for packages: write itself
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.x changed quorum-queue delivery limits (default 20, -1 = unlimited) —
        # the integration suite checks the browse guard against both
        rabbitmq: ["3.13-management", "4.1-management"]
    services:
      rabbitmq:
        image: rabbitmq:${{ matrix.rabbitmq }}
        env:
          RABBITMQ_DEFAULT_USER: queuelens
          RABBITMQ_DEFAULT_PASS: queuelens
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --user 999:999
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # tests/test_databases.py runs the persistence layer on it as well as on SQLite
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust  # a throwaway service on the runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Lint
        run: ruff check app tests
      - name: Type-check
        run: mypy app
      - name: Test (includes real-broker integration test)
        env:
          QUEUELENS_TEST_POSTGRES_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/postgres
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Boot smoke — app starts and serves the SPA
        env:
          QUEUELENS_AUTH_ENABLED: "false"
          QUEUELENS_DATABASE_URL: sqlite+aiosqlite:///./smoke.db
        run: |
          python -m uvicorn app.main:app --port 8123 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8123/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8123/app | grep -q "data.js"
          curl -sf http://127.0.0.1:8123/api/config > /dev/null
          kill %1

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: queuelens
          RABBITMQ_DEFAULT_PASS: queuelens
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install app + playwright
        run: |
          pip install -e ".[dev]" playwright
          playwright install chromium --with-deps
      - name: Boot app against the service broker
        env:
          QUEUELENS_AUTH_ENABLED: "false"
          QUEUELENS_RABBITMQ_URL: amqp://queuelens:queuelens@127.0.0.1:5672/
          QUEUELENS_RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
          QUEUELENS_RABBITMQ_MANAGEMENT_USERNAME: queuelens
          QUEUELENS_RABBITMQ_MANAGEMENT_PASSWORD: queuelens
          QUEUELENS_DATABASE_URL: sqlite+aiosqlite:///./e2e.db
        run: |
          python -m uvicorn app.main:app --port 8123 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8123/ready && break; sleep 1; done
      - name: Browser smoke
        env:
          E2E: "1"
        run: pytest tests/e2e -q

  acceptance:
    # black-box run: boots QueueLens itself against a real broker + mail servers and checks
    # every feature group end to end (tests/acceptance/run.py) — ~200 checks, ~4 min
    # the name keeps the SQLite runs' required-check names unchanged
    name: acceptance (${{ matrix.rabbitmq }}${{ matrix.database == 'postgres' && ', postgres' || '' }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        rabbitmq: ["3.13-management", "4.1-management"]
        database: [sqlite]
        include:
          - rabbitmq: "4.1-management"
            database: postgres
    services:
      rabbitmq:
        image: rabbitmq:${{ matrix.rabbitmq }}
        env:
          RABBITMQ_DEFAULT_USER: queuelens
          RABBITMQ_DEFAULT_PASS: queuelens
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --user 999:999
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install '.[dev]'
      - name: STARTTLS-only mail server with an untrusted certificate
        # services can't take command arguments, so this one starts here
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=untrusted.invalid \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem"
          chmod 644 "$RUNNER_TEMP"/*.pem
          docker run -d -p 1026:1025 -p 8027:8025 -v "$RUNNER_TEMP:/certs:ro" axllent/mailpit \
            --smtp-tls-cert /certs/cert.pem --smtp-tls-key /certs/key.pem --smtp-require-starttls
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8027/api/v1/info >/dev/null && break; sleep 1; done
      - name: PostgreSQL
        if: matrix.database == 'postgres'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for i in $(seq 1 30); do docker exec pg pg_isready -h 127.0.0.1 -q && break; sleep 1; done
      - name: Acceptance run
        env:
          ACCEPTANCE: "1"
          ACCEPTANCE_WORKDIR: ${{ runner.temp }}/acceptance
          ACCEPTANCE_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://postgres@127.0.0.1:5432/postgres' || '' }}
        run: |
          mkdir -p "$ACCEPTANCE_WORKDIR"
          python tests/acceptance/run.py
      - name: Upload results and server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-${{ matrix.rabbitmq }}-${{ matrix.database }}
          path: ${{ runner.temp }}/acceptance/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t queuelens:ci .

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, docker, acceptance]  # images ship only if the black-box run passes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  alerting:
    # deploy/ examples (docs/ALERTING.md): promtool rule tests, amtool routing, and a real
    # Alertmanager delivering to a local Slack/webhook sink — stdlib Python + Docker, < 1 min
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rules, routing and delivery
        run: python3 scripts/test_alerting.py

  helm:
    # deploy/helm/queuelens: lint, render the ci/ value sets, refuse bad ones, validate with
    # kubeconform, then install it next to a throwaway RabbitMQ in a kind cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v4.0.4
      - uses: helm/kind-action@v1
        with:
          version: v0.31.0
          install_only: true  # the script creates (and deletes) its own cluster
      - name: Lint, render, validate
        run: scripts/test_helm_chart.sh render
      - name: Install in kind
        run: scripts/test_helm_chart.sh kind
