# Rendered by scripts/test_helm_chart.sh: credentials in a Secret managed outside the chart,
# data on a claim created beforehand.
existingSecret: queuelens-credentials
persistence:
  existingClaim: queuelens-data
env:
  QUEUELENS_RABBITMQ_MANAGEMENT_URL: http://rabbitmq.messaging:15672
  QUEUELENS_RABBITMQ_MANAGEMENT_USERNAME: queuelens
  QUEUELENS_ENVIRONMENT: production
  QUEUELENS_MAX_MESSAGE_SIZE_BYTES: 1048576
  QUEUELENS_MASKING_ENABLED: true
  QUEUELENS_ENVIRONMENTS_JSON:
    staging:
      vhosts: ["/", staging]
