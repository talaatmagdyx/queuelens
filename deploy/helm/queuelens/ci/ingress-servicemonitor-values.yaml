# Rendered by scripts/test_helm_chart.sh: TLS ingress, a ServiceMonitor scraping with a
# Viewer account's credentials, a kept claim on a named StorageClass.
existingSecret: queuelens-credentials
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: queuelens.example.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: queuelens-tls
      hosts:
        - queuelens.example.internal
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  basicAuth:
    secretName: queuelens-metrics
persistence:
  storageClass: standard
  annotations:
    helm.sh/resource-policy: keep
podAnnotations:
  example.com/team: sre
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - key: dedicated
    operator: Equal
    value: ops
    effect: NoSchedule
