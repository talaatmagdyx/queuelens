{{- $required := splitList " " (include "queuelens.requiredSecretKeys" .) }}
{{- range $key := $required }}
{{- if hasKey $.Values.env $key }}
{{- fail (printf "%s is a secret: set it in secretEnv or existingSecret, not env" $key) }}
{{- end }}
{{- end }}
{{- if .Values.existingSecret }}
{{- if .Values.secretEnv }}
{{- fail "Set existingSecret or secretEnv, not both: with existingSecret every secret setting comes from that Secret" }}
{{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "queuelens.fullname" . }}
  labels:
    {{- include "queuelens.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key := $required }}
  {{- $value := required (printf "secretEnv.%s is required, or set existingSecret to a Secret that has it: the chart ships no default credentials (docs/KUBERNETES.md)" $key) (index $.Values.secretEnv $key) }}
  {{ $key }}: {{ include "queuelens.envValue" $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secretEnv }}
  {{- if not (has $key $required) }}
  {{ $key }}: {{ include "queuelens.envValue" $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
