{{- if .Values.serviceMonitor.enabled }}
{{- $auth := .Values.serviceMonitor.basicAuth }}
{{- $authSecret := required "serviceMonitor.basicAuth.secretName is required: /metrics needs Basic Auth, so name a Secret with the scrape account's username and password" $auth.secretName }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "queuelens.fullname" . }}
  labels:
    {{- include "queuelens.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "queuelens.selectorLabels" . | nindent 6 }}
  endpoints:
    # the QueueLens container's port rather than the Service port, which may front a sidecar
    - targetPort: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      basicAuth:
        username:
          name: {{ $authSecret }}
          key: {{ $auth.usernameKey }}
        password:
          name: {{ $authSecret }}
          key: {{ $auth.passwordKey }}
{{- end }}
