apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "queuelens.fullname" . }}
  labels:
    {{- include "queuelens.labels" . | nindent 4 }}
spec:
  # Always one, deliberately not a value: browse snapshots, per-queue operation locks and
  # the login limiter live in process memory (on SQLite and PostgreSQL alike). A second
  # replica could act on a queue while the first does, and snapshot pages would 404 on it.
  replicas: 1
  # Recreate, not RollingUpdate: an update never runs two pods at once, which also lets a
  # ReadWriteOnce volume move to the new pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "queuelens.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or (not .Values.existingSecret) .Values.podAnnotations }}
      annotations:
        {{- if not .Values.existingSecret }}
        # roll the pod when the chart's Secret changes
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "queuelens.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "queuelens.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      # Service links would add QUEUELENS_SERVICE_HOST and friends for a Service named
      # "queuelens": the app's own setting prefix.
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: queuelens
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "queuelens.secretName" . }}
          env:
            # Named again so that a Secret missing one stops the pod at
            # CreateContainerConfigError instead of starting on the app's defaults.
            {{- range $key := splitList " " (include "queuelens.requiredSecretKeys" .) }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "queuelens.secretName" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ include "queuelens.envValue" $value | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "queuelens.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
