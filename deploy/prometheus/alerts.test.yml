# Unit tests for alerts.yml: `promtool test rules alerts.test.yml` (scripts/test_alerting.py
# runs it in prom/prometheus:v3.15.0). One sample a minute, like a 30s-1m scrape.
# Only firing alerts count: an alert still inside its `for:` is expected as [].

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # Down 4 minutes, back, then down for good: the blip never fires, the outage does at 5m.
  - interval: 1m
    input_series:
      - series: 'queuelens_rabbitmq_ready{job="queuelens", instance="queuelens:8000"}'
        values: '1 0x4 1x4 0x9 1x4'  # down 1-5m, up 6-10m, down 11-20m, up from 21m
    alert_rule_test:
      - eval_time: 5m
        alertname: QueueLensBrokerDown
        exp_alerts: []
      - eval_time: 15m
        alertname: QueueLensBrokerDown
        exp_alerts: []
      - eval_time: 16m
        alertname: QueueLensBrokerDown
        exp_alerts:
          - exp_labels: {severity: critical, job: queuelens, instance: "queuelens:8000"}
            exp_annotations:
              summary: QueueLens lost its RabbitMQ connection
              description: queuelens_rabbitmq_ready has been 0 for 5 minutes.
      - eval_time: 21m
        alertname: QueueLensBrokerDown
        exp_alerts: []

  # Above 1000 for 15 minutes fires; exactly 1000 never does. The same DLQ name in another
  # environment and vhost is another alert.
  - interval: 1m
    input_series:
      - series: 'queuelens_dlq_messages{job="queuelens", instance="queuelens:8000", environment="development", vhost="/", queue="orders.dlq"}'
        values: '900 1500x20'  # above from 1m
      - series: 'queuelens_dlq_messages{job="queuelens", instance="queuelens:8000", environment="development", vhost="/", queue="billing.dlq"}'
        values: '1000x21'
      - series: 'queuelens_dlq_messages{job="queuelens", instance="queuelens:8000", environment="staging", vhost="ql-staging", queue="orders.dlq"}'
        values: '1200x21'
    alert_rule_test:
      - eval_time: 15m
        alertname: DLQAboveThreshold
        exp_alerts:
          - exp_labels: {severity: warning, environment: staging, vhost: ql-staging, queue: orders.dlq}
            exp_annotations:
              summary: DLQ orders.dlq in staging · ql-staging holds more than 1000 messages
              description: orders.dlq has 1200 dead letters.
      - eval_time: 16m
        alertname: DLQAboveThreshold
        exp_alerts:
          - exp_labels: {severity: warning, environment: development, vhost: "/", queue: orders.dlq}
            exp_annotations:
              summary: DLQ orders.dlq in development · / holds more than 1000 messages
              description: orders.dlq has 1500 dead letters.
          - exp_labels: {severity: warning, environment: staging, vhost: ql-staging, queue: orders.dlq}
            exp_annotations:
              summary: DLQ orders.dlq in staging · ql-staging holds more than 1000 messages
              description: orders.dlq has 1200 dead letters.

  # 290 dead letters at once fires on the next evaluation (no `for:`) and clears once the
  # jump leaves the 30m window; a steady 3/min (~90 per 30m) never fires.
  - interval: 1m
    input_series:
      - series: 'queuelens_dlq_messages{job="queuelens", instance="queuelens:8000", environment="development", vhost="/", queue="orders.dlq"}'
        values: '40x40 330x40'  # jumps at 41m
      - series: 'queuelens_dlq_messages{job="queuelens", instance="queuelens:8000", environment="development", vhost="/", queue="billing.dlq"}'
        values: '0+3x80'
    alert_rule_test:
      - eval_time: 40m
        alertname: DLQGrowing
        exp_alerts: []
      - eval_time: 41m
        alertname: DLQGrowing
        exp_alerts:
          - exp_labels: {severity: warning, environment: development, vhost: "/", queue: orders.dlq}
            exp_annotations:
              summary: DLQ orders.dlq in development · / is growing fast
              # delta() extrapolates to the whole window: 290 over 29m of samples reads 300
              description: orders.dlq grew by 300 messages in 30 minutes.
      - eval_time: 71m
        alertname: DLQGrowing
        exp_alerts: []

  # 14 failed replays fire at once; 2 failed parks and any number of successes never do.
  - interval: 1m
    input_series:
      - series: 'queuelens_actions_total{job="queuelens", instance="queuelens:8000", action="replay", result="failed"}'
        values: '2x20 16x20'  # +14 at 21m
      - series: 'queuelens_actions_total{job="queuelens", instance="queuelens:8000", action="park", result="failed"}'
        values: '5x20 7x20'   # +2 at 21m
      - series: 'queuelens_actions_total{job="queuelens", instance="queuelens:8000", action="replay", result="success"}'
        values: '0+50x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: QueueLensActionFailures
        exp_alerts: []
      - eval_time: 21m
        alertname: QueueLensActionFailures
        exp_alerts:
          - exp_labels: {severity: warning, action: replay}
            exp_annotations:
              summary: QueueLens actions are failing
              # increase() extrapolates too: 14 over 14m of samples reads 15
              description: 15 failed actions in the last 15 minutes — check the audit log.
      - eval_time: 36m
        alertname: QueueLensActionFailures
        exp_alerts: []

  # Two replicas report the same DLQ: one alert, not one per pod. Their failed actions add
  # up: 2 on each is 4 in all, which fires though neither pod alone passes 3.
  - interval: 1m
    input_series:
      - series: 'queuelens_dlq_messages{job="queuelens", instance="10.0.0.1:8000", environment="development", vhost="/", queue="orders.dlq"}'
        values: '1500x20'
      - series: 'queuelens_dlq_messages{job="queuelens", instance="10.0.0.2:8000", environment="development", vhost="/", queue="orders.dlq"}'
        values: '1500x20'
      - series: 'queuelens_actions_total{job="queuelens", instance="10.0.0.1:8000", action="park", result="failed"}'
        values: '0x5 2x15'
      - series: 'queuelens_actions_total{job="queuelens", instance="10.0.0.2:8000", action="park", result="failed"}'
        values: '0x5 2x15'
    alert_rule_test:
      - eval_time: 16m
        alertname: DLQAboveThreshold
        exp_alerts:
          - exp_labels: {severity: warning, environment: development, vhost: "/", queue: orders.dlq}
            exp_annotations:
              summary: DLQ orders.dlq in development · / holds more than 1000 messages
              description: orders.dlq has 1500 dead letters.
      - eval_time: 6m
        alertname: QueueLensActionFailures
        exp_alerts:
          - exp_labels: {severity: warning, action: park}
            exp_annotations:
              summary: QueueLens actions are failing
              # increase() extrapolates: 2 + 2 over 5m of samples in a 15m window reads 4
              description: 4 failed actions in the last 15 minutes — check the audit log.

  # A policy that paused itself alerts once, whatever the replica count; a policy a person
  # disabled (gauge 0) never does.
  - interval: 1m
    input_series:
      - series: 'queuelens_policy_paused{job="queuelens", instance="10.0.0.1:8000", policy="orders"}'
        values: '0x2 1x5'
      - series: 'queuelens_policy_paused{job="queuelens", instance="10.0.0.2:8000", policy="orders"}'
        values: '0x2 1x5'
      - series: 'queuelens_policy_paused{job="queuelens", instance="10.0.0.1:8000", policy="billing"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 1m
        alertname: ReplayPolicyPaused
        exp_alerts: []
      - eval_time: 3m
        alertname: ReplayPolicyPaused
        exp_alerts:
          - exp_labels: {severity: warning, policy: orders}
            exp_annotations:
              summary: Replay policy orders paused itself
              description: "orders stopped after failed runs: check the audit log, then re-enable it."

  # An environment QueueLens can't read for 5 minutes alerts; one any replica can read doesn't.
  - interval: 1m
    input_series:
      - series: 'queuelens_management_up{job="queuelens", instance="10.0.0.1:8000", environment="staging", vhost="ql-staging"}'
        values: '1x2 0x10'  # unreadable from 3m
      - series: 'queuelens_management_up{job="queuelens", instance="10.0.0.2:8000", environment="staging", vhost="ql-staging"}'
        values: '1x2 0x10'
      - series: 'queuelens_management_up{job="queuelens", instance="10.0.0.1:8000", environment="development", vhost="/"}'
        values: '1x2 0x10'
      - series: 'queuelens_management_up{job="queuelens", instance="10.0.0.2:8000", environment="development", vhost="/"}'
        values: '1x12'  # the other replica still reads it
    alert_rule_test:
      - eval_time: 7m
        alertname: QueueLensScopeUnreachable
        exp_alerts: []
      - eval_time: 8m
        alertname: QueueLensScopeUnreachable
        exp_alerts:
          - exp_labels: {severity: warning, environment: staging, vhost: ql-staging}
            exp_annotations:
              summary: "QueueLens can't read staging · ql-staging"
              description: "Its DLQs aren't monitored: check that broker's Management API and the credentials QueueLens uses."
