# Example Prometheus alert rules for QueueLens.
# Scrape /metrics with basic_auth (see docs/OPERATIONS.md), then tune the
# thresholds below to your traffic before shipping them to Alertmanager.

groups:
  - name: queuelens
    rules:
      - alert: QueueLensBrokerDown
        expr: queuelens_rabbitmq_ready == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "QueueLens lost its RabbitMQ connection"
          description: "queuelens_rabbitmq_ready has been 0 for 5 minutes."

      - alert: DLQAboveThreshold
        # every replica reports the same DLQs: one alert per queue, not per pod
        expr: max by (queue) (queuelens_dlq_messages) > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "DLQ {{ $labels.queue }} holds more than 1000 messages"
          description: "{{ $labels.queue }} has {{ $value | printf \"%.0f\" }} dead letters."

      - alert: DLQGrowing
        expr: max by (queue) (delta(queuelens_dlq_messages[30m])) > 100
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "DLQ {{ $labels.queue }} is growing fast"
          description: "{{ $labels.queue }} grew by {{ $value | printf \"%.0f\" }} messages in 30 minutes."

      - alert: QueueLensActionFailures
        # each replica counts its own actions: add them up
        expr: sum by (action) (increase(queuelens_actions_total{result="failed"}[15m])) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "QueueLens actions are failing"
          description: "{{ $value | printf \"%.0f\" }} failed actions in the last 15 minutes — check the audit log."

      - alert: ReplayPolicyPaused
        # every replica reports the same database-backed gauge
        expr: max by (policy) (queuelens_policy_paused) == 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Replay policy {{ $labels.policy }} paused itself"
          description: "{{ $labels.policy }} stopped after failed runs: check the audit log, then re-enable it."
